name: browser

on:
  push:
  pull_request:
    types:
      - synchronize
      - opened

env:
  EM_VERSION: 6.0.6
  EM_CACHE_FOLDER: 'emsdk-cache'

jobs:
  build:
    environment: aws-deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ runner.os }}-${{ env.EM_VERSION }}

      - name: Cache emscripten
        id: cache-emscripten
        uses: actions/cache@v4
        env:
          cache-name: cache-emscripten
        with:
          path: emsdk
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ env.EM_VERSION }}

      - name: install emsdk
        if: steps.cache-emscripten.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/emscripten-core/emsdk.git
          ./emsdk/emsdk install ${{ env.EM_VERSION }}
          ./emsdk/emsdk activate ${{ env.EM_VERSION }}

      - name: Cache libjpegturbo
        id: cache-libjpegturbo
        uses: actions/cache@v4
        env:
          cache-name: cache-libjpegturbo
        with:
          path: |
            libjpeg-turbo-2.1.0/
            2.1.0.tar.gz
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ env.EM_VERSION }}

      - name: Cache build directory
        id: cache-build
        uses: actions/cache@v4
        env:
          cache-name: cache-build
        with:
          path: build
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ env.EM_VERSION }}

      # Only the branches that deploy need (or, in a fork, have) credentials;
      # elsewhere this workflow just checks that the web build builds.
      - name: Configure AWS Credentials
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/endless-web' || github.ref == 'refs/heads/scriptable') }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Build
        run: source emsdk/emsdk_env.sh; make output/index.html
      - name: Deploy
        if: ${{ github.ref == 'refs/heads/endless-web' && github.event_name == 'push' }}
        run: source emsdk/emsdk_env.sh; make deploy
      - name: Deploy the scriptable fork
        if: ${{ github.ref == 'refs/heads/scriptable' && github.event_name == 'push' }}
        run: source emsdk/emsdk_env.sh; make deploy-scriptable SCRIPTABLE_DISTRIBUTION_ID=${{ vars.SCRIPTABLE_DISTRIBUTION_ID }}
